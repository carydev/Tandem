# TANDEM - Codex 설정
# 모델 ID는 /tandem 적응 단계에서 실제 계정 기준으로 교체된다.
# 전역 ~/.codex/config.toml 과 충돌하지 않는지 확인할 것.

model = "{{MODEL_MID}}"
model_reasoning_effort = "medium"
web_search = "cached"

[agents]
max_threads = 4
max_depth = 1

[multi_agent_v2]
agent_max_depth = 2

# 실무 기본
[profiles.work]
model = "{{MODEL_MID}}"
model_reasoning_effort = "high"
approval_policy = "never"
sandbox_mode = "workspace-write"

# 대량 단순 작업
[profiles.bulk]
model = "{{MODEL_LIGHT}}"
model_reasoning_effort = "medium"
approval_policy = "never"
sandbox_mode = "workspace-write"

# 적대 검토: 읽기 전용, 다른 모델
[profiles.critic]
model = "{{MODEL_TOP}}"
model_reasoning_effort = "high"
approval_policy = "never"
sandbox_mode = "read-only"

# 난제 승급. 조건은 model-routing.md
[profiles.escalate]
model = "{{MODEL_TOP}}"
model_reasoning_effort = "xhigh"
approval_policy = "never"
sandbox_mode = "workspace-write"
