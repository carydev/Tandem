# TANDEM - Codex configuration
# Model IDs are replaced with those available to the actual account during the /tandem adaptation step.
# Check for conflicts with the global ~/.codex/config.toml.

model = "{{MODEL_TOP}}"
model_reasoning_effort = "medium"
web_search = "cached"

[agents]
max_threads = 4
max_depth = 1

[multi_agent_v2]
agent_max_depth = 2

# Default work profile
[profiles.work]
model = "{{MODEL_MID}}"
model_reasoning_effort = "high"
approval_policy = "never"
sandbox_mode = "workspace-write"

# High-volume, straightforward tasks
[profiles.bulk]
model = "{{MODEL_LIGHT}}"
model_reasoning_effort = "medium"
approval_policy = "never"
sandbox_mode = "workspace-write"

# Adversarial review: read-only, different model
[profiles.critic]
model = "{{MODEL_TOP}}"
model_reasoning_effort = "high"
approval_policy = "never"
sandbox_mode = "read-only"

# Escalation for difficult tasks. See model-routing.md for the criteria.
[profiles.escalate]
model = "{{MODEL_TOP}}"
model_reasoning_effort = "xhigh"
approval_policy = "never"
sandbox_mode = "workspace-write"
