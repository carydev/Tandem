<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TANDEM board - {{PROJECT}}</title>
<style>
  :root { --bg:#f6f7f9; --panel:#eceef2; --card:#fff; --text:#1d2129; --muted:#667085; --line:#d9dde4; --accent:#3b6fd8; --bad:#c2410c; --good:#15803d; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16181d; --panel:#1f2229; --card:#2a2e37; --text:#e6e8ec; --muted:#9aa3b2; --line:#373c47; --accent:#7aa2f7; --bad:#f08a5d; --good:#5fd38d; } }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui,"Segoe UI","Malgun Gothic",sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; gap:16px; align-items:baseline; padding:14px 18px 6px; flex-wrap:wrap; }
  h1 { font-size:17px; margin:0; }
  #meta { color:var(--muted); font-size:12px; }
  #meta.stale { color:var(--bad); }
  #board { display:grid; grid-template-columns:repeat(7,minmax(170px,1fr)); gap:10px; padding:8px 18px 18px; overflow-x:auto; }
  .col { background:var(--panel); border-radius:8px; padding:8px; min-height:120px; }
  .col h2 { font-size:13px; margin:2px 4px 8px; display:flex; justify-content:space-between; color:var(--muted); font-weight:600; }
  .col.blocked h2 { color:var(--bad); }
  .col.done h2 { color:var(--good); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:6px; padding:7px 9px; margin-bottom:7px; }
  .card.fresh { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .col.blocked .card { border-left:3px solid var(--bad); }
  .id { font-weight:600; font-size:12px; color:var(--accent); }
  .title { margin:2px 0 4px; word-break:break-word; }
  .sub, .note { color:var(--muted); font-size:12px; }
  .note { margin-top:3px; font-style:italic; word-break:break-word; }
  .more { color:var(--muted); font-size:12px; padding:2px 4px; }
  .empty { color:var(--muted); font-size:12px; padding:30px 18px; }
</style>
</head>
<body>
<header><h1 id="title">TANDEM board</h1><span id="meta"></span></header>
<div id="board"></div>
<script>
(function () {
  var L = {
    ko: { cols:{todo:'할 일',doing:'진행중',built:'작업완료',review:'리뷰',test:'테스트',done:'완료',blocked:'막힘'},
          updated:'갱신', ago:'전', sec:'초', min:'분', hour:'시간', day:'일', none:'카드가 없습니다. board.ps1 add -Task <ID> 로 추가합니다.',
          stale:'데이터를 읽지 못했습니다 (board-data.js)', more:'외 {0}건', runs:'실행 {0}회' },
    en: { cols:{todo:'To do',doing:'In progress',built:'Built',review:'Review',test:'Test',done:'Done',blocked:'Blocked'},
          updated:'updated', ago:'ago', sec:'s', min:'m', hour:'h', day:'d', none:'No cards yet. Add one with board.ps1 add -Task <ID>.',
          stale:'Could not read board-data.js', more:'{0} more', runs:'{0} runs' }
  };
  var order = ['todo','doing','built','review','test','done','blocked'];
  var DONE_LIMIT = 15, lastRev = -1, lastOk = 0, data = null;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function num(n) { if (n == null) return ''; if (n >= 1e6) return (n/1e6).toFixed(1)+'M'; if (n >= 1e4) return Math.round(n/1e3)+'k'; if (n >= 1e3) return (n/1e3).toFixed(1)+'k'; return String(Math.round(n)); }
  function dur(s) { if (s == null) return ''; if (s < 60) return s+'s'; if (s < 3600) return Math.floor(s/60)+'m '+(s%60)+'s'; return Math.floor(s/3600)+'h '+Math.floor((s%3600)/60)+'m'; }
  function age(iso, t) {
    var d = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
    if (isNaN(d)) return '';
    if (d < 60) return Math.floor(d)+t.sec+' '+t.ago; if (d < 3600) return Math.floor(d/60)+t.min+' '+t.ago;
    if (d < 86400) return Math.floor(d/3600)+t.hour+' '+t.ago; return Math.floor(d/86400)+t.day+' '+t.ago;
  }
  function render() {
    if (!data) return;
    var t = L[data.lang] || L.ko;
    document.getElementById('title').textContent = 'TANDEM - ' + (data.project || '');
    var cards = (data.cards || []).slice().sort(function (a, b) { return Date.parse(b.updated) - Date.parse(a.updated); });
    var host = document.getElementById('board');
    if (!cards.length) { host.innerHTML = '<div class="empty">' + esc(t.none) + '</div>'; return; }
    var html = '';
    order.forEach(function (col) {
      var list = cards.filter(function (c) { return c.column === col; });
      var shown = col === 'done' ? list.slice(0, DONE_LIMIT) : list;
      html += '<div class="col ' + col + '"><h2><span>' + esc(t.cols[col]) + '</span><span>' + list.length + '</span></h2>';
      shown.forEach(function (c) {
        var s = c.stats || {}, bits = [];
        if (c.by) bits.push(esc(c.by)); else if (s.agent) bits.push(esc(s.agent));
        if (s.model) bits.push(esc(s.model));
        var bits2 = [];
        if (s.runs) bits2.push(esc(t.runs.replace('{0}', s.runs)));
        if (s.duration_s != null) bits2.push(dur(s.duration_s));
        if (s.tokens != null) bits2.push(num(s.tokens) + ' tok');
        bits2.push(age(c.updated, t));
        var fresh = (Date.now() - Date.parse(c.updated)) < 15000 ? ' fresh' : '';
        html += '<div class="card' + fresh + '"><div class="id">' + esc(c.id) + '</div>' +
                (c.title ? '<div class="title">' + esc(c.title) + '</div>' : '') +
                (bits.length ? '<div class="sub">' + bits.join(' · ') + '</div>' : '') +
                '<div class="sub">' + bits2.join(' · ') + '</div>' +
                (c.note ? '<div class="note">' + esc(c.note) + '</div>' : '') + '</div>';
      });
      if (list.length > shown.length) html += '<div class="more">' + esc(t.more.replace('{0}', list.length - shown.length)) + '</div>';
      html += '</div>';
    });
    host.innerHTML = html;
  }
  function meta() {
    var el = document.getElementById('meta'), t = data ? (L[data.lang] || L.ko) : L.ko;
    if (!data) { el.textContent = t.stale; el.className = 'stale'; return; }
    el.className = (Date.now() - lastOk) > 15000 ? 'stale' : '';
    el.textContent = (el.className ? t.stale + ' · ' : '') + t.updated + ' ' + age(data.updated, t) + ' · rev ' + data.rev;
  }
  // file:// pages cannot fetch JSON, so board.ps1 also writes board-data.js and we reload it as a script.
  function poll() {
    var old = document.getElementById('board-data');
    var s = document.createElement('script');
    s.id = 'board-data'; s.charset = 'utf-8'; s.src = 'board-data.js?r=' + Date.now();
    s.onload = function () {
      lastOk = Date.now();
      var d = window.TANDEM_BOARD;
      if (d && d.rev !== lastRev) { data = d; lastRev = d.rev; render(); } else if (d) { data = d; render(); }
      meta();
    };
    s.onerror = function () { meta(); };
    if (old) old.parentNode.removeChild(old);
    document.head.appendChild(s);
  }
  poll(); setInterval(poll, 3000);
})();
</script>
</body>
</html>
